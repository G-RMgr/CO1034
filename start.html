<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Start</title>
</head>
<body>
<h1>Start <span id="treasureHunt"></span></h1>

<p> Provide your Name to start the Treasure Hunt</p>
<form id="startForm">
    <input type="text" id="playerName" maxlength="30" placeholder="Enter your Name" autocomplete="nickname">
    <button type="submit">Start</button>
</form>

<!-- Location developer: tells the player if location is on or if there is a problem -->
<p id="locationMessage">Checking your location...</p>



<script>
    const treasureHuntNameElement = document.getElementById("treasureHunt");
    const playerNameElement = document.getElementById("playerName");
    const params = new URLSearchParams(window.location.search);

    if (!params.has("name") || !params.has("uuid")) {
        alert("Please enter a valid name and uuid to start the Treasure Hunt.");
        location.href="app.html";
        throw new Error("Missing params");
    }
    treasureHuntNameElement.textContent = params.get("name");

    function start(event) {
        event.preventDefault();
        const playerName = playerNameElement.value.trim();
        if (!playerName) {
            alert("Please enter your name.");
            return;
        }
        localStorage.setItem("treasureHuntName", params.get("name"));
        const appName = "TEAM_G"
        const uuid = params.get("uuid");
        const START_URL = "https://codecyprus.org/th/api/start?" + "player=" + encodeURIComponent(playerName) + "&app=" + appName + "&treasure-hunt-id=" + uuid;
        fetch(START_URL)
        .then(res => res.json())
        .then(data => {
            console.log(data);
            if(data.status === "OK") {
               localStorage.setItem("session", data.session);
               localStorage.setItem("player", playerName);
                location.href = 'question.html'
            }
            

            


            else{
                alert(data.errorMessages);
            }
            
        })

        .catch(error => {
                console.error("Error starting the game:", error);
                alert("An error occurred while starting the game. Please try again.");
            });

            
    }
    document.getElementById("startForm").addEventListener("submit", start);

    // Location developer: check the location before the hunt starts
    // (the updates every 2 minutes are sent from the question page by location.js)
    const locationMessageElement = document.getElementById("locationMessage");

    // Runs when the browser gives the location
    function locationAllowed() {
        locationMessageElement.textContent = "Location is on. Your position will be sent to the game every 2 minutes.";
        locationMessageElement.style.color = "green";
    }

    // Runs when the browser cannot give the location, each error has its own message
    function locationBlocked(error) {
        let message = "Something went wrong while finding your location.";

        if (error.code === error.PERMISSION_DENIED) {
            message = "Location permission was denied. Please allow location in your browser settings, some clues need it.";
        }
        else if (error.code === error.POSITION_UNAVAILABLE) {
            message = "Your position is not available right now. Check your GPS or signal.";
        }
        else if (error.code === error.TIMEOUT) {
            message = "Finding your location took too long. Check your GPS or signal.";
        }

        locationMessageElement.textContent = message;
        locationMessageElement.style.color = "red";
    }

    // Ask the browser for the position
    function checkLocation() {
        if (!navigator.geolocation) {
            locationMessageElement.textContent = "Your browser does not support location.";
            locationMessageElement.style.color = "red";
            return;
        }
        navigator.geolocation.getCurrentPosition(locationAllowed, locationBlocked, { timeout: 10000 });
    }

    checkLocation();

</script>


</body>
</html>
