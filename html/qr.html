

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>

    <script src=""></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:20px;
            text-align:center;
        }

        #reader{
            width:100%;
            max-width:500px;
            margin:auto;
        }

        #result{
            margin-top:30px;
            padding:10px;
            border:1px solid #ddd;
            border-radius:10px;
        }

        button{
            padding:10px 20px;
            margin:10px;
            cursor:pointer;
        }

        input{
            width:90%;
            padding:10px;
            margin-top:10px;
        }
    </style> </head>



<h1>Treasure Hunt QR Scanner</h1>

<div id="reader"></div>

<div id="result">
    <h3>QR Result</h3>
    <p id="qrText">No QR scanned yet</p>

    <input
            type="text"
            id="answerBox"
            placeholder="Scanned text will appear here">

    <div>
        <button id="openButton" style="display:none;">
            Open URL
        </button>
        <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
        <script>
            const qrText = document.getElementById("qrText");
            const answerBox = document.getElementById("answerBox");
            const openButton = document.getElementById("openButton");

            // uses the existing <div id="reader">
            const scanner = new Html5Qrcode("reader");

            function onScanSuccess(content) {
                qrText.textContent = content;
                answerBox.value = content;

                if (content.startsWith("http://") || content.startsWith("https://")) {
                    openButton.style.display = "inline-block";
                    openButton.onclick = function () {
                        window.open(content, "_blank", "noopener");
                    };
                } else {
                    openButton.style.display = "none";
                }
            }

            async function startScanner() {
                try {
                    // "environment" = rear camera on phones, falls back to the webcam on laptops
                    await scanner.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 250 } },
                        onScanSuccess
                    );
                } catch (error) {
                    console.error(error);
                    alert("Could not start the camera: " + error);
                }
            }

            startScanner();
        </script>
    </div>
</div>

</body>
</html>
