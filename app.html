<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Treasure Hunt Adventure</title>
</head>
<body>
    <h1>List of Treasure Hunts</h1>


    <div id = "treasureHunts">
    </div>

    <button id="my button" onclick="LoadTreasureHunts()">Load Treasure Hunts</button>

<script>

    const LIST_URL = "https://codecyprus.org/th/api/list";
    fetch(LIST_URL)
        .then(response => response.json())
        .then(data => {
            if (data.status === "OK") {
                const list = document.getElementById('treasureHunts');
                const treasureHunts = data.treasureHunts;

                for (let i = 0; i < treasureHunts.length; i++) {
                    let listItem = document.createElement('li');
                    listItem.innerHTML = "<a href='start.html?uuid=" + treasureHunts[i].uuid + "'>" + treasureHunts[i].name + "</a>";
                    list.appendChild(listItem);
                }
            }
            else{
                alert(data.errorMessages);
            }

        });
    </script>
