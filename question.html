<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question</title>
</head>
<body>

<h2 id="questionTitle">Loading...</h2>
<p id="questionNumber"></p>
<p id="message"></p>

<div id="inputBox"></div>
<br>
<button id="submitButton" onclick="checkAnswer()">Submit</button>
<div id="skipBox"></div>

<script>
    // Read sessionID from URL or sessionStorage
    const urlParams = new URLSearchParams(window.location.search);
    let sessionID = urlParams.get("sessionID");

    if (sessionID == null) {
        sessionID = sessionStorage.getItem("session");
    } else {
        sessionStorage.setItem("session", sessionID);
    }

    if (sessionID == null) {
        alert("No session found!");
        window.location.href = "app.html";
    } else {
        getQuestion();
    }

    function getQuestion() {
        if (sessionID == null) {
            return;
        }

        document.getElementById("questionTitle").innerHTML = "Loading...";
        document.getElementById("questionNumber").innerHTML = "";
        document.getElementById("message").innerHTML = "";
        document.getElementById("inputBox").innerHTML = "";
        document.getElementById("skipBox").innerHTML = "";

        let url = "https://codecyprus.org/th/api/question?session=" + encodeURIComponent(sessionID);

        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.status == "OK") {
                    if (data.completed == true) {
                        showFinished();
                    } else {
                        document.getElementById("questionTitle").innerHTML = data.questionText;
                        let current = data.currentQuestionIndex + 1;
                        document.getElementById("questionNumber").innerHTML =
                            "Question " + current + " of " + data.numOfQuestions;

                        makeInput(data.questionType);

                        if (data.canBeSkipped == true) {
                            document.getElementById("skipBox").innerHTML =
                                '<br><button onclick="skip()">Skip Question</button>';
                        }
                    }
                } else {
                    document.getElementById("questionTitle").innerHTML = "Error!";
                    document.getElementById("message").innerHTML = data.errorMessages;
                }
            })
            .catch(() => {
                document.getElementById("questionTitle").innerHTML = "Error!";
                document.getElementById("message").innerHTML =
                    "Network error. Check your internet connection and refresh.";
            });
    }

    function makeInput(type) {
        let box = document.getElementById("inputBox");

        if (type == "INTEGER") {
            box.innerHTML = '<input type="number" name="userAnswer" id="userAnswer" step="1" required placeholder="Enter a whole number">';
        } else if (type == "NUMERIC") {
            box.innerHTML = '<input type="number" name="userAnswer" id="userAnswer" step="any" required placeholder="Enter a number">';
        } else if (type == "TEXT") {
            box.innerHTML = '<input type="text" name="userAnswer" id="userAnswer" maxlength="100" required placeholder="Type your answer">';
        } else if (type == "BOOLEAN") {
            box.innerHTML = '<select name="userAnswer" id="userAnswer" required>' +
                '<option value="">Choose...</option>' +
                '<option value="true">True</option>' +
                '<option value="false">False</option>' +
                '</select>';
        } else if (type == "MCQ") {
            box.innerHTML = '<select name="userAnswer" id="userAnswer" required>' +
                '<option value="">Choose...</option>' +
                '<option value="A">A</option>' +
                '<option value="B">B</option>' +
                '<option value="C">C</option>' +
                '<option value="D">D</option>' +
                '</select>';
        }
    }

    function checkAnswer() {
        if (sessionID == null) {
            return;
        }

        let input = document.getElementById("userAnswer");
        if (input == null) {
            document.getElementById("message").innerHTML = "Question is not ready yet.";
            return;
        }

        // Check HTML built-in validation rules (like step="1" or required)
        if (!input.checkValidity()) {
            input.reportValidity();
            return;
        }

        let answer = input.value.trim();
        if (answer == "") {
            document.getElementById("message").innerHTML = "Please write or choose an answer first.";
            return;
        }

        document.getElementById("message").innerHTML = "Checking answer...";

        let url = "https://codecyprus.org/th/api/answer?session=" +
            encodeURIComponent(sessionID) +
            "&answer=" + encodeURIComponent(answer);

        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.status == "OK") {
                    if (data.correct == true) {
                        document.getElementById("message").innerHTML = "Correct!";
                        if (data.completed == true) {
                            setTimeout(showFinished, 1000);
                        } else {
                            setTimeout(getQuestion, 1000);
                        }
                    } else {
                        document.getElementById("message").innerHTML = "Wrong answer, try again!";
                    }
                } else {
                    document.getElementById("message").innerHTML = data.errorMessages;
                }
            })
            .catch(() => {
                document.getElementById("message").innerHTML = "Error! Could not send your answer.";
            });
    }

    function skip() {
        if (sessionID == null) {
            return;
        }

        document.getElementById("message").innerHTML = "Skipping question...";

        let url = "https://codecyprus.org/th/api/skip?session=" + encodeURIComponent(sessionID);

        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.status == "OK") {
                    if (data.completed == true) {
                        showFinished();
                    } else {
                        document.getElementById("message").innerHTML = "Question skipped.";
                        setTimeout(getQuestion, 1000);
                    }
                } else {
                    document.getElementById("message").innerHTML = data.errorMessages;
                }
            })
            .catch(() => {
                document.getElementById("message").innerHTML = "Error! Could not skip question.";
            });
    }

    function showFinished() {
        document.getElementById("questionTitle").innerHTML = "You finished the treasure hunt!";
        document.getElementById("questionNumber").innerHTML = "";
        document.getElementById("message").innerHTML = "";
        document.getElementById("inputBox").innerHTML = "";
        document.getElementById("skipBox").innerHTML = "";
        document.getElementById("submitButton").style.display = "none";
    }
</script>

</body>
</html>
