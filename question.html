<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<h2 id="questionTitle">Loading...</h2>
<p id="questionNumber"></p>
<p id="message"></p>

<div id="inputBox"></div>
<br>
<button id="submitButton" onclick="checkAnswer()">Submit</button>
<div id="skipBox"></div>

<script>
    
    
    let sessionID = localStorage.getItem("session");


    function formatErrors(errorMessages) {
        if (Array.isArray(errorMessages)) {
            return errorMessages.join(", ");
        }
        return errorMessages || "";
    }

    function clearSavedSession() {
        localStorage.removeItem("session");
        localStorage.removeItem("player");
        sessionID = null;
    }

    function handleApiError(errorMessages, fallbackText) {
        const currentSession = sessionID;
        const msg = formatErrors(errorMessages) || fallbackText;
        document.getElementById("message").textContent = msg;

        if (/time\s*(limit|expired|up)/i.test(msg)) {
            clearSavedSession();
            document.getElementById("questionTitle").textContent = "Time is up!";
            const sessionParam = currentSession ? "?session=" + encodeURIComponent(currentSession) : "";
            document.getElementById("inputBox").innerHTML =
                "<p><a href='leaderboard.html" + sessionParam + "'>View Leaderboard</a></p>" +
                "<p><a href='app.html'>Back to treasure hunt</a></p>";
            document.getElementById("skipBox").innerHTML = "";
            document.getElementById("submitButton").style.display = "none";
        }
    }



    if (sessionID == null) {
        alert("No session found!");
        window.location.href = "app.html";
    } else {
        getQuestion();
    }

    function getQuestion() {
        if (sessionID == null) {
            return;
        }

        document.getElementById("questionTitle").innerHTML = "Loading...";
        document.getElementById("questionNumber").innerHTML = "";
        document.getElementById("message").innerHTML = "";
        document.getElementById("inputBox").innerHTML = "";
        document.getElementById("skipBox").innerHTML = "";

        let url = "https://codecyprus.org/th/api/question?session=" + encodeURIComponent(sessionID);

        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.status == "OK") {
                    if (data.completed == true) {
                        showFinished();
                    } else {
                        document.getElementById("questionTitle").innerHTML = data.questionText;
                        let current = data.currentQuestionIndex + 1;
                        document.getElementById("questionNumber").innerHTML =
                            "Question " + current + " of " + data.numOfQuestions;

                        makeInput(data.questionType);

                        if (data.canBeSkipped == true) {
                            document.getElementById("skipBox").innerHTML =
                                '<br><button onclick="skip()">Skip Question</button>';
                        }
                    }
                } else {
                    document.getElementById("questionTitle").textContent = "Error!";
                    handleApiError(data.errorMessages, "Could not load question.");
                }
            })
            .catch(() => {
                document.getElementById("questionTitle").textContent = "Error!";
                document.getElementById("message").textContent =
                    "Network error. Check your connection and refresh.";
            });
    }
    function makeInput(type) {
        let box = document.getElementById("inputBox");

        if (type == "INTEGER") {
            box.innerHTML = '<input type="number" name="userAnswer" id="userAnswer" step="1" required placeholder="Enter a whole number">';
        } else if (type == "NUMERIC") {
            box.innerHTML = '<input type="number" name="userAnswer" id="userAnswer" step="any" required placeholder="Enter a number">';
        } else if (type == "TEXT") {
            box.innerHTML = '<input type="text" name="userAnswer" id="userAnswer" maxlength="100" required placeholder="Type your answer">';
        } else if (type == "BOOLEAN") {
            box.innerHTML = '<select name="userAnswer" id="userAnswer" required>' +
                '<option value="">Choose...</option>' +
                '<option value="true">True</option>' +
                '<option value="false">False</option>' +
                '</select>';
        } else if (type == "MCQ") {
            box.innerHTML = '<select name="userAnswer" id="userAnswer" required>' +
                '<option value="">Choose...</option>' +
                '<option value="A">A</option>' +
                '<option value="B">B</option>' +
                '<option value="C">C</option>' +
                '<option value="D">D</option>' +
                '</select>';
        }
    }

    function checkAnswer() {
        if (sessionID == null) {
            return;
        }

        let input = document.getElementById("userAnswer");
        if (input == null) {
            document.getElementById("message").innerHTML = "Question is not ready yet.";
            return;
        }

        // Check HTML built-in validation rules (like step="1" or required)
        if (!input.checkValidity()) {
            input.reportValidity();
            return;
        }

        let answer = input.value.trim();
        if (answer == "") {
            document.getElementById("message").innerHTML = "Please write or choose an answer first.";
            return;
        }

        document.getElementById("message").innerHTML = "Checking answer...";

        let url = "https://codecyprus.org/th/api/answer?session=" +
            encodeURIComponent(sessionID) +
            "&answer=" + encodeURIComponent(answer);

        fetch(url)
            .then(r => r.json())
           .then(data => {
                console.log(data);
                if (data.status == "OK") {
                    const delta = typeof data.scoreAdjustment === "number"
                        ? data.scoreAdjustment
                        : (typeof data.scoreChange === "number" ? data.scoreChange : null);
                    const scoreText = delta !== null
                        ? " (" + (delta >= 0 ? "+" : "") + delta + " pts)"
                        : "";

                    if (data.correct == true) {
                        document.getElementById("message").textContent = "Correct!" + scoreText;
                        if (data.completed == true) {
                            setTimeout(showFinished, 1000);
                        } else {
                            setTimeout(getQuestion, 1000);
                        }
                    } else {
                        document.getElementById("message").textContent = "Wrong answer, try again!" + scoreText;
                    }
                } else {
                    handleApiError(data.errorMessages, "Could not check answer.");
                }
            })
            .catch(() => {
                document.getElementById("message").innerHTML = "Error! Could not send your answer.";
            });
    }

    function skip() {
        if (sessionID == null) {
            return;
        }


        if (!confirm ("Skipping this question may cost points. Are you sure you want to skip?")) {
        return;
    }

        document.getElementById("message").innerHTML = "Skipping question...";

        let url = "https://codecyprus.org/th/api/skip?session=" + encodeURIComponent(sessionID);

        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.status == "OK") {
                    if (data.completed == true) {
                        showFinished();
                    } else {
                        document.getElementById("message").innerHTML = "Question skipped.";
                        setTimeout(getQuestion, 1000);
                    }
                } else {
                    handleApiError(data.errorMessages, "Could not skip question.");
                }
            })
            .catch(() => {
                document.getElementById("message").innerHTML = "Error! Could not skip question.";
            });
    }

    function showFinished() {
        const finishedSession = sessionID;
        clearSavedSession();

        document.getElementById("questionTitle").textContent = "You finished the treasure hunt!";
        document.getElementById("questionNumber").textContent = "";
        document.getElementById("message").textContent = "Loading your score...";
        document.getElementById("inputBox").innerHTML = "";
        document.getElementById("skipBox").innerHTML = "";
        document.getElementById("submitButton").style.display = "none";

        const scoreUrl = "https://codecyprus.org/th/api/score?session=" + encodeURIComponent(finishedSession);

        fetch(scoreUrl)
            .then(r => r.json())
            .then(data => {
                if (data.status == "OK") {
                    document.getElementById("message").textContent = "Final Score: " + data.score;
                } else {
                    document.getElementById("message").textContent =
                        formatErrors(data.errorMessages) || "Could not load your score.";
                }
            })
            .catch(() => {
                document.getElementById("message").textContent = "Could not load your score.";
            })
            .finally(() => {
                document.getElementById("inputBox").innerHTML =
                    "<p><a href='leaderboard.html?session=" + encodeURIComponent(finishedSession) + "'>View Leaderboard</a></p>" + "<p><a href='app.html'>Back to treasure hunt</a></p>";
            });
    }
</script>

</body>
</html>
