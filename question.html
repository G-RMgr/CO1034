<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question</title>
</head>
<body>
<h2 id = "questionText"></h2>
<p id = "question"></p>
<p id = "feedback"></p>

<div  id = "answersArea"></div>
<div id = "skipArea"></div>
<form>
    <input type="button" value="Submit" />
</form>


<script>



    // Get the player's session
    const sessionID = params.get("sessionID");

    // Check whether a session exists
    if (!params.has("sessionID")) {
        alert("No active game session found.");
        location.href = "app.html";
    }

    // Get HTML elements
    const questionTextElement =
        document.getElementById("questionText");

    const questionElement =
        document.getElementById("question");

    const answerInput =
        document.getElementById("answerInput");

    const feedbackElement =
        document.getElementById("feedback");

    // Create the question API URL
    const QUESTION_URL =
        "https://codecyprus.org/th/api/question?session=" +
        sessionID;

    // Load a question
    async function loadQuestion() {

        try {

            const response = await fetch(QUESTION_URL);
            const data = await response.json();

            if (data.status === "OK") {

                if (data.completed) {
                    questionTextElement.textContent =
                        "Congratulations! You completed the treasure hunt.";

                    answerInput.disabled = true;
                    return;
                }

                questionTextElement.textContent =
                    data.questionText;

                questionElement.textContent =
                    "Question " +
                    (data.currentQuestionIndex + 1) +
                    " of " +
                    data.numOfQuestions;

                answerInput.value = "";
                feedbackElement.textContent = "";

            } else {

                feedbackElement.textContent =
                    "Unable to load question.";

                console.error(data.errorMessages);
            }

        } catch (error) {

            feedbackElement.textContent =
                "Something went wrong.";

            console.error(error);
        }
    }

    // Submit the player's answer
    async function submitAnswer() {

        const answer = answerInput.value.trim();

        if (!answer) {
            feedbackElement.textContent =
                "Please enter an answer.";
            return;
        }

        try {

            const ANSWER_URL =
                "https://codecyprus.org/th/api/answer?session=" +
               sessionID +
                "&answer=" +
                answer;

            const response = await fetch(ANSWER_URL);
            const data = await response.json();

            if (data.status === "OK") {

                if (data.correct) {

                    feedbackElement.textContent =
                        "Correct answer!";

                    if (data.completed) {
                        questionTextElement.textContent =
                            "Congratulations! You completed the treasure hunt.";

                        answerInput.disabled = true;
                        return;
                    }

                    loadQuestion();

                } else {

                    feedbackElement.textContent =
                        "Incorrect answer. Try again.";

                }

            } else {

                feedbackElement.textContent =
                    "Unable to submit your answer.";

                console.error(data.errorMessages);
            }

        } catch (error) {

            feedbackElement.textContent =
                "Something went wrong.";

            console.error(error);
        }
    }

    // Load the first question
    if (sessionID) {
        loadQuestion();
    }

    function skipQuestion(){
        const SKIP_URL = "https://codecyprus.org/th/api/skip?session=" + sessionID;

        fetch(SKIP_URL)
        .then(res=>res.json())
        .then(data=>{
            console.log(data);
            if (data.status === "OK") {
                document.getElementById("questionText").innerHTML ="Question Skipped!";
                loadQuestion();
            } else {
                alert(data.errorMessages);
            }
        })

    }

</script>
</body>
</html>
